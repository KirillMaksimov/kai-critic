# One record per wave. Copy into <your lab>/waves/W<NN>.yaml and fill it in
# during §6 of the run: the runs and the findings before the owner has answered,
# his answers once he has.
#
# This file is the SOURCE OF TRUTH for every number in the lab. The main thread
# writes it once; `tools/wave_stats.py` computes the ledger row, the main
# thread's ratios, the per-lens yield and the cross-wave medians from it. Nothing
# is counted by hand, and nothing is retyped into prose.
#
# Validate before trusting anything:
#   python tools/wave_stats.py --lab <your lab dir> check W<NN>

wave: W27
date: '2026-09-28'
object: design # design | strategy | instruction
mode: grounded # blind | grounded
effort: normal # normal | enhanced | experimental

# Two texts decide what this wave's numbers mean, and the record names both.
#
# `charter_version` — the charter the LENSES actually ran under. It decides what
# they return: raw findings, topics, unique topics. Agent definitions are
# snapshotted when the session starts, so this can be older than the skill.
#
# `skill_version` — the skill the MAIN THREAD worked under. It decides what the
# owner is asked and so what the ratios measure. Before 0.9.0 he was asked "is it
# true?"; from 0.9.0 "was it useful?" on three ranks; from 0.10.0 on four, with
# "extended" between "changed" and "refined". The tool computes each record by
# the rules of its own skill era and never puts two eras, or two scales, in one
# table.
#
# A change to either text cuts ITS numbers off from every wave before it and
# leaves the other's alone.
charter_version: '0.9.2'
skill_version: '0.17.0'

# Only when the owner rated on four ranks while an older skill still asked on
# three — his marks are what the record keeps. Leave it out otherwise: the skill
# version decides.
# useful_scale: 4

# Optional pointers, for the human reading the lab later.
note: path/to/review-note.md
paths: 40 # how many paths the run was granted

tokens:
  total: 2100000
  by_arm: { A: 924337, B: 1173089 } # experimental waves only

# The main thread's own half of the cost, from 0.13.0: merge, checks, sorting,
# the review file. `duration_ms` is the wall time from launching the topic pass
# to the review file on disk, from two timestamps the main thread takes; `tokens`
# only when the host reports the session's usage. Leave either out rather than
# guess — a guess prints as a measurement.
main_thread:
  duration_ms: 3120000
  tokens: 410000

# true when this session also wrote the object under review — the authorship
# confound: the same context verifies, sorts and predicts. Optional.
authored_in_session: true

# The topic pass that ran before the lenses (skill §3). The lenses read its list,
# so a lens-side number compares only with waves whose topic pass ran on the same
# model, and `median` splits by it. On an experimental wave whose arms differ
# here, one entry per arm, and every arm of `runs` must have one:
# { A: { model: opus, runs: 1, topics: 40 }, B: { ... } }. An arm that ran
# without a topic pass says `runs: 0`.
topic_pass:
  model: opus
  runs: 1
  topics: 38

# ---------------------------------------------------------------------------
# One entry per RUN, not per lens: at `enhanced` a lens runs twice, and the two
# runs are the measurement. `topics` holds the topic ids this run named AFTER its
# own restatements were merged — with no cap on findings a lens repeats itself,
# and that repetition is not a signal.
# ---------------------------------------------------------------------------
runs:
  - id: ben-1
    lens: beneficiary # beneficiary | adversary | auditor
    arm: A # experimental waves only; omit otherwise
    model: sonnet
    raw_findings: 9 # what it returned, before any merging
    topics: [T1, T4, T9, T14]
    # Optional, copied from the usage line of the agent's result as they stand:
    # no rounding, no conversion. `stats` prints the run's minutes and, per arm,
    # the slowest run — an arm's lenses run in parallel. Leave both out rather
    # than guess: a missing value prints blank, a guessed one reads as measured.
    duration_ms: 780000
    tool_uses: 84
    reads: batch
    # `reads: batch` goes on every run launched with the `READS: batch` line: from
    # skill 0.16.0 that is every lens of a normal or enhanced wave, and `check`
    # refuses such a wave with one missing. Omit only on a run that read one
    # call per turn — an experimental arm measuring reading, or a wave from
    # before 0.16.0. Each mode is a series of its own in `median`.
    # extra_topics: 1 — when one finding the lens returned carried two topics;
    # `raw_findings` stays what the lens returned. Omit when every finding had one.
  - id: adv-1
    lens: adversary
    arm: A
    model: sonnet
    raw_findings: 12
    topics: [T2, T3, T4, T11]
    duration_ms: 912000
    tool_uses: 89
    reads: batch
  - id: aud-1
    lens: auditor
    arm: A
    model: sonnet
    raw_findings: 7
    topics: [T5, T6]
    duration_ms: 1050000
    tool_uses: 83
    reads: batch

# ---------------------------------------------------------------------------
# One entry per finding AFTER the merge.
#
# `from` lists the runs that named it — this is what makes a topic's uniqueness
# computable, and a run id that does not exist is a validation error, not a
# smaller number.
#
# `block` says who decided (skill §5 step 2):
#   owner — ruling on it meant choosing what a person sees or gets. Carries the
#           owner's two answers and the main thread's two sealed predictions.
#   agent — every sensible fix gave a person the same thing; the main thread
#           decided and showed the decision as a row. Carries `correction` only.
# ---------------------------------------------------------------------------
findings:
  - id: N1
    topic: T4
    from: [ben-1, adv-1] # two seats from different sides — severity goes up
    severity: high # high | medium | low
    axis: concept # concept | detail
    # Optional, from 0.12.0: the reach as the review file showed it — "N of M …"
    # or "N из M …", `whole object` / «весь объект», `not counted …` /
    # «не посчитан …». `check` refuses anything else; `reach` groups the owner's
    # marks by it, to ask whether a narrow finding reads as noise.
    reach: "12 of 1 400 items"
    status: shown # shown | removed
    block: owner # owner | agent
    predicted_useful: refined
    useful: changed # changed | extended | refined | noise — HIS mark; leave out if he left it blank
    predicted: fix
    ruling: fix # fix | no_fix | into_task | until_shown
    fix: own # mine | own | delegated | none

  # "Your choice": he handed the decision back. Nobody's repair was chosen, so it
  # leaves the fix-hit denominator and is counted beside it — it is a datum about
  # the sorting (this belonged in the agent block), not about the repertoire.
  - id: N2
    topic: T9
    from: [ben-1]
    severity: medium
    axis: concept
    status: shown
    block: owner
    predicted_useful: refined
    useful: extended # the design stands, but what a person gets reaches further
    predicted: fix
    ruling: fix
    fix: delegated

  # "I will know when I see it": not an acceptance, not a rejection. No mark, no
  # repair; the finding stays open and §6 carries it to where the showing happens.
  # A blank mark is left out, never guessed.
  - id: N3
    topic: T1
    from: [ben-1]
    severity: high
    axis: concept
    status: shown
    block: owner
    predicted_useful: noise
    predicted: no_fix
    ruling: until_shown

  # The main thread's own block. `accepted` is written for every row he left
  # uncorrected once he has returned the file — silence is assent. A correction
  # is `amended` (the decision stands, made more exact) or `overturned` (a
  # different decision replaces it). Leave `correction` out until he has answered.
  - id: N4
    topic: T2
    from: [adv-1]
    severity: high
    axis: detail
    status: shown
    block: agent
    correction: accepted

  - id: N5
    topic: T5
    from: [aud-1]
    severity: medium
    axis: detail
    status: shown
    block: agent
    correction: amended

  # A row he took back from the main thread's block: written out in full in his
  # block and ruled on like the rest. `returned: true` keeps the datum.
  - id: N6
    topic: T3
    from: [adv-1]
    severity: medium
    axis: detail
    status: shown
    block: owner
    returned: true
    useful: changed
    ruling: into_task
    fix: none

  # A finding the main thread refuted before showing it: it leaves every
  # denominator but stays visible, so the removal can never flatter a number it
  # is measured against.
  - id: N7
    topic: T11
    from: [adv-1]
    severity: medium
    axis: detail
    status: removed
    removed_reason: >-
      ran the refutation: the guard it says is missing is at db.py:212 and every
      writer goes through it.

  # Set aside in step 1 as outside the delivery (charter §3 rule 11) — the
  # owner's standing ruling, not a refutation, so the reason names the class and
  # the kind can be counted apart. `plans` is recorded too, although the review
  # file never shows it.
  - id: N9
    topic: T14
    from: [ben-1]
    severity: medium
    axis: concept
    status: removed
    removed_reason: "outside the delivery — later delivery"

  # A finding of the main thread's own, outside the lenses: `from` stays empty.
  - id: N8
    topic: T12
    from: []
    severity: medium
    axis: detail
    status: shown
    block: agent
    correction: accepted

  # From skill 0.14.0 a main-thread row that does not need the owner stands in
  # the appendix. Silence there means unread, not assent: leave `correction`
  # out unless he corrected it. `check` refuses `accepted` on such a row.
  - id: N10
    topic: T6
    from: [aud-1]
    severity: low
    axis: detail
    status: shown
    block: agent
    placed: appendix

# Only when HE said, in so many words, that he read rows of the appendix — in
# chat, or in the review file (over the appendix, or "agreed" written into one
# row's slot, which is `rows: [<that id>]`). Quote him verbatim,
# without outer quotation marks; `rows` is `all` (every appendix row he did not
# correct) or the ids his words were about. The rows keep no `correction`: a row
# covered here and left uncorrected is counted as accepted on his word, apart
# from the body's accepted and from the unread, and `stats` prints the quote.
# Never infer it — from a reply that came quickly, from rows he must have
# scrolled past — and never ask him for it: an unread appendix row is not a gap.
# Leave it out otherwise; never copy the example's words into a record.
# appendix_read:
#   - where: chat # chat | file
#     date: '2026-09-28'
#     quote: <his words, as he wrote them>
#     rows: all # or [N10, …]

# ---------------------------------------------------------------------------
# Records written under a skill before 0.9.0 keep their own vocabulary and stay
# valid as they are — `predicted` / `ruling`: accept | accept_with_correction |
# downgrade | into_task | reject; `fix`: mine | own | none; no `block`, no
# `useful`, no `skill_version`. Do not convert them: a precision re-expressed as
# a usefulness share would be a number nobody measured.
# ---------------------------------------------------------------------------
